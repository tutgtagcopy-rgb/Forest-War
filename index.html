<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOREST WAR</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010201;font-family:Arial,sans-serif}
canvas{display:block}
#menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#17201d 0%,#050706 45%,#000 100%);color:#ddd}
.menuBox{width:440px;text-align:center}
.logo{font-size:55px;font-weight:900;letter-spacing:9px;text-shadow:0 0 25px #9aa49f}
.sub{font-size:11px;letter-spacing:6px;opacity:.45;margin:8px 0 40px}
button{width:100%;padding:17px;margin:6px 0;background:#101512;border:1px solid #424b46;color:#ddd;font-weight:bold;letter-spacing:3px;cursor:pointer}
button:hover{background:#202a25;border-color:#aab4ae}
.online{font-size:13px;letter-spacing:2px;opacity:.7;margin-bottom:18px}
#lobbyBox{display:none;margin-top:8px}
input{width:100%;padding:15px;background:#070908;border:1px solid #343a37;color:white;text-align:center;font-size:18px;letter-spacing:5px}
#credits{display:none;margin-top:15px;padding:15px;border-top:1px solid #333;font-size:13px;line-height:1.8;opacity:.75}
#hud{display:none;position:fixed;inset:0;z-index:10;pointer-events:none;color:#ddd}
#title{position:absolute;top:15px;left:18px;font-size:12px;letter-spacing:4px;opacity:.65}
#lobby{position:absolute;top:15px;right:18px;font-size:12px;letter-spacing:3px;opacity:.7}
#cross{position:absolute;left:50%;top:50%;width:5px;height:5px;border:1px solid #aaa;border-radius:50%;transform:translate(-50%,-50%)}
#status{position:absolute;bottom:18px;left:18px;font-size:14px;line-height:1.5;text-shadow:0 2px 5px #000}
#help{position:absolute;bottom:18px;right:18px;text-align:right;font-size:11px;line-height:1.7;opacity:.6}
#damage{position:absolute;inset:0;background:rgba(150,0,0,.65);opacity:0}
#shot{position:absolute;inset:0;background:#fff;opacity:0}
</style>
</head>
<body>

<div id="menu">
<div class="menuBox">
<div class="logo">FOREST WAR</div>
<div class="sub">REALISTIC BODYCAM PVP</div>
<div class="online">● <span id="online">1</span> PLAYERS ONLINE</div>
<button id="play">PLAY</button>
<button id="create">CREATE LOBBY</button>
<div id="lobbyBox">
<input id="codeInput" maxlength="6" placeholder="LOBBY CODE">
<button id="join">JOIN LOBBY</button>
</div>
<button id="creditButton">CREDITS</button>
<div id="credits">
FOREST WAR<br>
Made by Owen<br>
Game Developer · Creator
</div>
</div>
</div>

<div id="hud">
<div id="title">FOREST WAR // BODYCAM</div>
<div id="lobby">LOBBY: <span id="lobbyCode">------</span></div>
<div id="cross"></div>
<div id="status">HP 100<br>STAMINA 100<br>FLASHLIGHT OFF<br>AMMO 30 / 120</div>
<div id="help">
WASD MOVE · SHIFT SPRINT · CTRL CROUCH<br>
T FLASHLIGHT · LMB FIRE · R RELOAD · ESC RELEASE MOUSE
</div>
<div id="damage"></div>
<div id="shot"></div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const menu=document.getElementById("menu");
const hud=document.getElementById("hud");
const online=document.getElementById("online");
const lobbyBox=document.getElementById("lobbyBox");
const codeInput=document.getElementById("codeInput");

let onlinePlayers=3+Math.floor(Math.random()*9);
online.textContent=onlinePlayers;

setInterval(()=>{
onlinePlayers=Math.max(1,onlinePlayers+Math.floor(Math.random()*3)-1);
online.textContent=onlinePlayers;
},5000);

function lobbyCode(){
const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
let s="";
for(let i=0;i<6;i++)s+=chars[Math.floor(Math.random()*chars.length)];
return s;
}

function startGame(code){
document.getElementById("lobbyCode").textContent=code;
menu.style.display="none";
hud.style.display="block";
renderer.domElement.requestPointerLock();
}

document.getElementById("play").onclick=()=>startGame(lobbyCode());

document.getElementById("create").onclick=()=>{
lobbyBox.style.display=lobbyBox.style.display==="block"?"none":"block";
codeInput.value=lobbyCode();
};

document.getElementById("join").onclick=()=>{
let c=codeInput.value.trim().toUpperCase();
if(c.length<4)c=lobbyCode();
startGame(c);
};

document.getElementById("creditButton").onclick=()=>{
const c=document.getElementById("credits");
c.style.display=c.style.display==="block"?"none":"block";
};

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x020503);
scene.fog=new THREE.FogExp2(0x102019,.035);

const camera=new THREE.PerspectiveCamera(
78,
innerWidth/innerHeight,
.05,
500
);

const renderer=new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.55;
document.body.appendChild(renderer.domElement);

const moon=new THREE.DirectionalLight(0x80938c,.24);
moon.position.set(-30,50,-20);
scene.add(moon);

const ambient=new THREE.HemisphereLight(
0x354a42,
0x020302,
.22
);

scene.add(ambient);

const groundMat=new THREE.MeshStandardMaterial({
color:0x172019,
roughness:1
});

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(500,500),
groundMat
);

ground.rotation.x=-Math.PI/2;
scene.add(ground);

const collisionObjects=[];

function tree(x,z,scale=1){

const g=new THREE.Group();

const trunkMat=new THREE.MeshStandardMaterial({
color:0x30251b,
roughness:1
});

const leafMat=new THREE.MeshStandardMaterial({
color:0x17281c,
roughness:1
});

const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.25,.42,5*scale,8),
trunkMat
);

trunk.position.y=2.5*scale;

const leaves1=new THREE.Mesh(
new THREE.ConeGeometry(2.7*scale,4*scale,8),
leafMat
);

leaves1.position.y=5.2*scale;

const leaves2=new THREE.Mesh(
new THREE.ConeGeometry(2.15*scale,3.2*scale,8),
leafMat
);

leaves2.position.y=7*scale;

const leaves3=new THREE.Mesh(
new THREE.ConeGeometry(1.5*scale,2.8*scale,8),
leafMat
);

leaves3.position.y=8.4*scale;

g.add(trunk,leaves1,leaves2,leaves3);
g.position.set(x,0,z);
g.rotation.y=Math.random()*Math.PI;

scene.add(g);
collisionObjects.push(g);
}

for(let i=0;i<240;i++){

const x=(Math.random()-.5)*380;
const z=(Math.random()-.5)*380;

if(Math.hypot(x,z)<20)continue;

tree(
x,
z,
.75+Math.random()*1.2
);
}

const rockMat=new THREE.MeshStandardMaterial({
color:0x343b35,
roughness:1
});

for(let i=0;i<80;i++){

const rock=new THREE.Mesh(
new THREE.DodecahedronGeometry(
.4+Math.random()*1.2,
0
),
rockMat
);

rock.position.set(
(Math.random()-.5)*360,
.4,
(Math.random()-.5)*360
);

rock.scale.y=.5;
scene.add(rock);
}

function makePlayerModel(color=0x202522){

const g=new THREE.Group();

const bodyMat=new THREE.MeshStandardMaterial({
color,
roughness:.9
});

const skinMat=new THREE.MeshStandardMaterial({
color:0x7d5d4a,
roughness:.9
});

const body=new THREE.Mesh(
new THREE.CapsuleGeometry(.32,.9,6,10),
bodyMat
);

body.position.y=1.15;

const head=new THREE.Mesh(
new THREE.SphereGeometry(.25,12,10),
skinMat
);

head.position.y=1.95;

const leftArm=new THREE.Mesh(
new THREE.CapsuleGeometry(.11,.7,5,8),
bodyMat
);

leftArm.position.set(-.43,1.2,0);
leftArm.rotation.z=.18;

const rightArm=new THREE.Mesh(
new THREE.CapsuleGeometry(.11,.7,5,8),
bodyMat
);

rightArm.position.set(.43,1.2,0);
rightArm.rotation.z=-.18;

const leftLeg=new THREE.Mesh(
new THREE.CapsuleGeometry(.14,.8,5,8),
new THREE.MeshStandardMaterial({color:0x151817})
);

leftLeg.position.set(-.18,.45,0);

const rightLeg=leftLeg.clone();
rightLeg.position.x=.18;

g.add(
body,
head,
leftArm,
rightArm,
leftLeg,
rightLeg
);

return g;
}

const player={
pos:new THREE.Vector3(0,0,10),
yaw:0,
pitch:0,
hp:100,
stamina:100,
crouch:false,
flash:false,
ammo:30,
reserve:120,
fireCooldown:0,
reload:0
};

const playerModel=makePlayerModel(0x303734);
playerModel.visible=false;
scene.add(playerModel);

camera.position.set(
player.pos.x,
1.7,
player.pos.z
);

const flashlight=new THREE.SpotLight(
0xffffff,
0,
55,
Math.PI/8,
.48,
1.5
);

const flashlightTarget=new THREE.Object3D();
flashlightTarget.position.set(0,0,-15);

camera.add(flashlight);
camera.add(flashlightTarget);

flashlight.target=flashlightTarget;
scene.add(camera);

const keys={};

addEventListener("keydown",e=>{

keys[e.code]=true;

if(e.code==="KeyT"){
player.flash=!player.flash;
flashlight.intensity=player.flash?22:0;
}

if(e.code==="ControlLeft"||e.code==="ControlRight"){
player.crouch=true;
}

if(e.code==="KeyR"){
reload();
}

});

addEventListener("keyup",e=>{

keys[e.code]=false;

if(e.code==="ControlLeft"||e.code==="ControlRight"){
player.crouch=false;
}

});

renderer.domElement.addEventListener(
"click",
()=>renderer.domElement.requestPointerLock()
);

addEventListener("mousemove",e=>{

if(document.pointerLockElement!==renderer.domElement)return;

player.yaw-=e.movementX*.0022;
player.pitch-=e.movementY*.0022;

player.pitch=Math.max(
-1.45,
Math.min(1.45,player.pitch)
);

});

function reload(){

if(player.reload>0)return;
if(player.ammo>=30)return;
if(player.reserve<=0)return;

player.reload=1.6;
}

const bullets=[];

function shoot(){

if(player.reload>0)return;
if(player.fireCooldown>0)return;

if(player.ammo<=0){
reload();
return;
}

player.ammo--;
player.fireCooldown=.105;

const origin=camera.getWorldPosition(
new THREE.Vector3()
);

const direction=new THREE.Vector3(
0,0,-1
).applyQuaternion(camera.quaternion);

const ray=new THREE.Raycaster(
origin,
direction,
0,
150
);

const objects=[
ground,
...bots.map(b=>b.model)
];

const hits=ray.intersectObjects(objects,true);

let end=origin.clone().addScaledVector(
direction,
150
);

if(hits.length){
end.copy(hits[0].point);

const hitObject=hits[0].object;

for(const b of bots){

if(
hitObject===b.model||
b.model.getObjectById(hitObject.id)
){
b.hp-=34;
break;
}

}
}

const geometry=new THREE.BufferGeometry()
.setFromPoints([origin,end]);

const material=new THREE.LineBasicMaterial({
color:0xffc978,
transparent:true,
opacity:.9
});

const tracer=new THREE.Line(
geometry,
material
);

scene.add(tracer);

setTimeout(()=>{
scene.remove(tracer);
geometry.dispose();
material.dispose();
},45);

const shot=document.getElementById("shot");

shot.style.opacity=".7";

setTimeout(()=>{
shot.style.opacity="0";
},35);
}

addEventListener("mousedown",e=>{
if(e.button===0)shoot();
});

const bots=[];

for(let i=0;i<10;i++){

const model=makePlayerModel(
i%2===0?0x343b38:0x202a24
);

model.position.set(
(Math.random()-.5)*150,
0,
(Math.random()-.5)*150
);

if(model.position.length()<25)
model.position.z+=40;

scene.add(model);

bots.push({
model,
hp:100,
dir:Math.random()*Math.PI*2,
timer:Math.random()*3,
shootTimer:Math.random()*5
});
}

function updateBots(dt){

for(const b of bots){

if(b.hp<=0){

b.model.visible=false;

if(Math.random()<dt*.03){

b.hp=100;
b.model.visible=true;

b.model.position.set(
(Math.random()-.5)*150,
0,
(Math.random()-.5)*150
);

}

continue;
}

b.timer-=dt;

if(b.timer<=0){

b.dir+=(
Math.random()-.5
)*2;

b.timer=1+Math.random()*4;
}

b.model.position.x+=
Math.sin(b.dir)*dt*.9;

b.model.position.z+=
Math.cos(b.dir)*dt*.9;

b.model.rotation.y=b.dir;

const distance=b.model.position.distanceTo(
player.pos
);

if(distance<35){

b.model.lookAt(
player.pos.x,
0,
player.pos.z
);

b.shootTimer-=dt;

if(b.shootTimer<=0){

b.shootTimer=1.5+Math.random()*2;

player.hp-=5;

const damage=document.getElementById("damage");

damage.style.opacity=".35";

setTimeout(()=>{
damage.style.opacity="0";
},90);

if(player.hp<=0){

player.hp=100;
player.pos.set(0,0,10);

}

}

}

}

}

let last=performance.now();
let time=0;

function loop(now){

requestAnimationFrame(loop);

const dt=Math.min(
(now-last)/1000,
.05
);

last=now;
time+=dt;

const forward=new THREE.Vector3(
Math.sin(player.yaw),
0,
Math.cos(player.yaw)
);

const right=new THREE.Vector3(
Math.cos(player.yaw),
0,
-Math.sin(player.yaw)
);

const movement=new THREE.Vector3();

if(keys.KeyW)
movement.addScaledVector(forward,-1);

if(keys.KeyS)
movement.add(forward);

if(keys.KeyA)
movement.addScaledVector(right,-1);

if(keys.KeyD)
movement.add(right);

if(movement.lengthSq()>0)
movement.normalize();

const sprint=
(keys.ShiftLeft||keys.ShiftRight)&&
!player.crouch&&
player.stamina>1&&
movement.lengthSq()>0;

let speed;

if(player.crouch)
speed=1.9;
else if(sprint)
speed=7;
else
speed=4;

if(sprint)
player.stamina=Math.max(
0,
player.stamina-dt*25
);
else
player.stamina=Math.min(
100,
player.stamina+dt*15
);

player.pos.addScaledVector(
movement,
speed*dt
);

player.pos.x=THREE.MathUtils.clamp(
player.pos.x,
-190,
190
);

player.pos.z=THREE.MathUtils.clamp(
player.pos.z,
-190,
190
);

const targetHeight=
player.crouch?1.05:1.7;

player.pos.y=THREE.MathUtils.lerp(
player.pos.y,
targetHeight,
.15
);

const bob=
movement.lengthSq()>0
?
Math.sin(
time*(sprint?13:9)
)*(sprint?.035:.018)
:0;

camera.position.set(
player.pos.x,
player.pos.y+bob,
player.pos.z
);

camera.rotation.order="YXZ";
camera.rotation.y=player.yaw;
camera.rotation.x=player.pitch;

player.fireCooldown=Math.max(
0,
player.fireCooldown-dt
);

if(player.reload>0){

player.reload-=dt;

if(player.reload<=0){

const needed=30-player.ammo;
const amount=Math.min(
needed,
player.reserve
);

player.ammo+=amount;
player.reserve-=amount;
}

}

updateBots(dt);

document.getElementById("status").innerHTML=
`HP ${Math.max(0,Math.floor(player.hp))}
<br>STAMINA ${Math.floor(player.stamina)}
<br>FLASHLIGHT ${player.flash?"ON":"OFF"}
<br>AMMO ${player.ammo} / ${player.reserve}
${player.reload>0?"<br>RELOADING":""}
${player.crouch?"<br>CROUCH":""}
${sprint?"<br>SPRINT":""}`;

renderer.render(
scene,
camera
);
}

requestAnimationFrame(loop);

addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(
innerWidth,
innerHeight
);
});
</script>
</body>
</html>
